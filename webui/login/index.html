<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Admin sign in · Song-DL</title>
<meta name="description" content="Sign in to queue downloads on the server.">
<link rel="icon" href="/assets/icon/icon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icon/icon.png" type="image/png" sizes="1024x1024">
<link rel="apple-touch-icon" href="/assets/icon/home-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1f2021">
<meta name="apple-mobile-web-app-title" content="Song-DL">
<link rel="stylesheet" href="/vendored/web-design-wavefront/design_language.css">
<link rel="stylesheet" href="/style.css">
<script src="/vendored/web-design-wavefront/design_language.js" defer></script>
<script src="/main.js" defer></script>
</head>
<body class="page" data-page="login">

<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <a class="topbar-title brand" href="/">Song-DL</a>
</header>

<main id="main" tabindex="-1" class="page-body auth-page">
  <div class="auth">
    <div class="auth-card auth-card-flat">
      <h1 class="auth-title" id="login-title">Admin sign in</h1>

      <form class="auth-form" id="login-form" aria-labelledby="login-title">
        <div class="field">
          <label class="field-label" for="login-user">Username</label>
          <input class="input" id="login-user" type="text" autocomplete="username" name="username" required>
        </div>
        <div class="field">
          <label class="field-label" for="login-pass">Password</label>
          <input class="input" id="login-pass" type="password" autocomplete="current-password" name="password" required>
        </div>
        <div class="auth-row">
          <label class="choice"><input type="checkbox" id="login-remember" name="remember" checked><span class="choice-box"></span><span class="choice-label">Stay signed in</span></label>
        </div>
        <!-- main.js swaps this for the Cloudflare Turnstile widget when webserver.turnstile is set in
             config.yaml, and hides it otherwise -->
        <div class="turnstile-placeholder" id="login-turnstile" role="img" aria-label="Cloudflare Turnstile placeholder">
          Cloudflare Turnstile
        </div>
        <p class="field-error" id="login-error" role="alert" hidden></p>
        <button class="button button-filled button-block" type="submit">Sign in</button>
      </form>
    </div>
  </div>
</main>

<footer class="site-footer">
  <!-- TODO: point at the real repository -->
  <a class="site-footer-link" href="https://github.com/SlopHobbyist/song-dl">Github</a>
</footer>

</body>
</html>
