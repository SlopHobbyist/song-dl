# Song-DL. Copy config.yaml.example to config.yaml and edit it, then: sudo docker compose up -d
#
# Ports are published below, not taken from config.yaml:
#   - web UI: change the left side of "8080:8080" to serve on another port
#     (webserver.ip and webserver.port in config.yaml only apply outside Docker)
#   - Soulseek: if you change soulseek.listen_port, change both sides of
#     "50300:50300" to match, and forward that port on your router
#
# Folders next to this file:
#   downloads/  every song: files fetched for visitors, and the folders admins save songs into
#   slskd/      slskd's settings and data
#   data/       the admin queue, remembered across restarts
#   certs/      cert.pem and key.pem when webserver.https is on
#   models/     the small AI model that answers uploaders' captchas (about 1 GB, downloaded the first
#               time the llm container starts)
#
# The captcha answerer is off by default and its llm container doesn't start. To use it, set
# captcha.enabled: True in config.yaml and run: sudo docker compose --profile captcha up -d

services:
  # Writes slskd/slskd.yml from config.yaml, then exits.
  setup:
    build: &build
      context: .
      dockerfile: server/Dockerfile
    image: song-dl
    command: ["python", "-m", "songdl", "setup"]
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./slskd:/slskd
    restart: "no"

  slskd:
    image: slskd/slskd:0.26.0
    depends_on:
      setup:
        condition: service_completed_successfully
    volumes:
      - ./slskd:/app
      - ./downloads:/app/downloads
    ports:
      - "50300:50300"
    restart: unless-stopped

  app:
    build: *build
    image: song-dl
    depends_on:
      setup:
        condition: service_completed_successfully
      slskd:
        condition: service_started
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./slskd:/slskd:ro
      - ./downloads:/downloads
      - ./data:/data
      - ./certs:/certs
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Reads uploaders' messages to spot captchas (see captcha in config.yaml). CPU only. Only the app can
  # reach it. It sleeps after 10 idle minutes, leaving the model on disk instead of in memory.
  # Only started with --profile captcha, so the model isn't downloaded unless you use it.
  llm:
    profiles: ["captcha"]
    image: ghcr.io/ggml-org/llama.cpp:server-b11749
    command: ["-hf", "Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M", "--host", "0.0.0.0", "--port", "8080",
              "--ctx-size", "2048", "--parallel", "1", "--no-webui", "--sleep-idle-seconds", "600"]
    environment:
      - LLAMA_CACHE=/models
    volumes:
      - ./models:/models
    restart: unless-stopped
